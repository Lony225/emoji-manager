appId: dev.lony.emoji-manager
productName: Emoji Manager
copyright: Copyright © 2026 LONY
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
asar: true
# 网页“一键导入”用的协议：emojimanager://subscribe?url=…
protocols:
  - name: Emoji Manager
    schemes: [emojimanager]
npmRebuild: false
compression: normal

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: 表情包管理器
  createDesktopShortcut: true
  installerLanguages: [zh_CN, en_US]
  language: '2052'

portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # 未签名：首次打开需在 系统设置 → 隐私与安全性 里点"仍要打开"
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  sign: false

linux:
  icon: build/icon.png
  category: Utility
  target: [AppImage]
