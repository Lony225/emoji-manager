appId: dev.lony.emoji-manager
productName: Emoji Manager
copyright: Copyright © 2026 LONY
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - '!dist-electron/meme-native/**'
  - package.json
# 模板表情的原生库：按目标平台只带一份，放在 resources/meme/（asar 之外）。
# @memecrafters/meme-generator 放在 devDependencies：只在构建时用来取各平台的 .node；
# 若放进 dependencies，macOS 上的 electron-builder 会把 5 个平台的原生包一起塞进 asar.unpacked（多出约 150 MB）。
extraResources:
  - from: dist-electron/meme-native/${os}-${arch}
    to: meme
    filter:
      - '*.node'
asar: true
# 网页“一键导入”用的协议：emojimanager://subscribe?url=…
protocols:
  - name: Emoji Manager
    schemes: [emojimanager]
npmRebuild: false
compression: normal
# 内置更新（electron-updater）：据此在 Windows 包旁边生成 latest.yml（安装包的 sha512、大小）和 .blockmap（增量下载用），
# 并把 resources/app-update.yml 写进安装包。实际上传由 CI 的 release 任务做（构建时传 --publish never），这里只是声明文件在 GitHub Releases
publish:
  provider: github
  owner: Lony225
  repo: emoji-manager

# 安装包文件名里不能有空格：GitHub 会把附件名里的空格换成点，而 latest.yml 里记的是本地文件名，两者必须一致，
# 所以直接写成 GitHub 上的样子（Emoji.Manager-…）。应用检查更新时按这个约定拼地址（src/core/update.ts）
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: Emoji.Manager-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: 表情包管理器
  createDesktopShortcut: true
  installerLanguages: [zh_CN, en_US]
  language: '2052'

portable:
  artifactName: Emoji.Manager-${version}-portable.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: Emoji.Manager-${version}-mac-${arch}.${ext}
  # 未签名：首次打开需在 系统设置 → 隐私与安全性 里点"仍要打开"
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  sign: false

linux:
  icon: build/icon.png
  category: Utility
  target: [AppImage]
