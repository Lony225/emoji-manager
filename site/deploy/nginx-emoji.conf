# /etc/nginx/sites-available/emoji
# 表情包预览网站：静态图片由 nginx 直接提供，其余交给 Node（127.0.0.1:8844）
# HTTPS 由 certbot --nginx 自动补上（它会改写本文件并加 443 的 server 块）

server {
    listen 80;
    listen [::]:80;
    server_name emoji.ourmeetismyserendipity-pplovecpu.fun;

    access_log /var/log/nginx/emoji_access.log;
    error_log /var/log/nginx/emoji_error.log;

    # 导入 zip 可能很大；服务端会流式落盘处理
    client_max_body_size 2048m;
    client_body_timeout 600s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 图片文件名含内容哈希，可以永久缓存
    location /images/ {
        alias /var/www/emoji/data/images/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # 脚本样式不长期缓存：每次都用 ETag 校验，发布后浏览器立刻拿到新文件（图片仍永久缓存）
    location /assets/ {
        root /var/www/emoji/public;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:8844;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
